        <!-- /* timer */ -->
        <script>
            const countdownStart = new Date('2025-04-01T00:00:00').getTime();
            const eventStart = new Date('2025-05-24T09:00:00').getTime();
            // const eventStart = new Date('2025-04-24T09:00:00').getTime();
            const eventEnd = new Date('2025-05-25T23:59:59').getTime();
            // const eventEnd = new Date('2025-04-25T23:59:59').getTime();
            const totalCountdownDuration = eventStart - countdownStart;

            function updateCountdown() {
                const now = new Date().getTime();
                let distance, progress, statusText;

                if (now < eventStart) {
                    distance = eventStart - now;
                    const elapsed = now - countdownStart;
                    progress = Math.min((elapsed / totalCountdownDuration) * 100, 100);

                    if (window.innerWidth <= 600) {
                        document.getElementById("event-date").innerHTML = "24–25 maja";
                        statusText = `${formatTime(distance)}`;
                    } 
                    else {
                        document.getElementById("event-date").innerHTML = "24–25 maja&nbsp;";
                        statusText = ` | ${formatTime(distance)}`;
                    }
                }
                else if (now <= eventEnd) {
                    progress = 100;
                    if (window.innerWidth <= 600) {
                        document.getElementById("event-date").innerHTML = "24–25 maja";
                        statusText = "in progress...";
                    }
                    else {
                        document.getElementById("event-date").innerHTML = "24–25 maja&nbsp;";
                        statusText = " | in progress...";
                    }
                }
                else {
                    progress = 100;
                    document.getElementById("event-date").textContent = "";
                    if (window.innerWidth <= 600) {
                        statusText = "see you next edition! ⌨️";
                    }
                    else {
                        statusText = "see you next edition! ⌨️";
                    }
                }

                document.getElementById("ctdwn").textContent = statusText;
                document.getElementById("progress-bar").style.width = `${progress}%`;
                
                const progressBarContainer = document.getElementById("progress-bar-container");
                if (now >= eventStart) {
                    progressBarContainer.style.display = "none";
                }

                const progressBar = document.getElementById("progress-bar");

                progressBar.innerText = `${progress.toFixed(0)}%`;
            }

            function formatTime(ms) {
                const days = Math.floor(ms / (1000 * 60 * 60 * 24));
                const hours = Math.floor((ms % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((ms % (1000 * 60)) / 1000);
                return `${days}d ${hours}h ${minutes}m ${seconds}s`;
            }

            updateCountdown();
            setInterval(updateCountdown, 1000);
        </script>

        <!-- /* timeline dot filler */ -->
        <script>
            const eventTimes = [
                { time: "2025-05-24T09:00:00", title: "Rozpoczęcie rejestracji", timeDelay: "20"},
                { time: "2025-05-24T10:30:00", title: "Koniec rejestracji", timeDelay: "10"},
                { time: "2025-05-24T11:00:00", title: "Ogłoszenie tematu", timeDelay: "10"},
                { time: "2025-05-24T11:10:00", title: "Praca nad projektami", timeDelay: "590" },
                { time: "2025-05-24T21:00:00", title: "Czas na integrację, gry i jedzonko", timeDelay: "60" },
                { time: "2025-05-24T22:00:00", title: "Ostatnie poprawki i prezentacje", timeDelay: "900" },
                { time: "2025-05-25T13:00:00", title: "Ogłoszenie trzech najlepszych projektów", timeDelay: "20" },
                { time: "2025-05-25T13:30:00", title: "Prezentacje i pitch'e top 3 zespołów", timeDelay: "75" },
                { time: "2025-05-25T15:00:00", title: "Ogłoszenie zwyciężcy ZSKathon'u", timeDelay: "20" }
            ]

            const timelineItems = document.querySelectorAll(".timeline-item");
            
            function updateTimeline() {
                const now = new Date().getTime();

                eventTimes.forEach((event, index) => {
                    const eventTime = new Date(event.time).getTime();
                    const eventTimeM15 = eventTime - 15 * 60 * 1000; // 15 minutes before the event time
                    const eventTimeAfter = eventTime + event.timeDelay * 60 * 1000; // 2 hours after the event time
                    const timelineItem = timelineItems[index];
                    const circle = timelineItem.querySelector(".circle");

                    if (now >= eventTimeAfter) {
                        circle.classList.add("filled");
                        circle.classList.remove("current");
                    } else if (now >= eventTime) {
                        circle.classList.add("current");
                        circle.classList.remove("filled");
                    } else {
                        circle.classList.remove("filled", "current");
                    }
                });
            }

            updateTimeline();
            setInterval(updateTimeline, 60_000); // Update every minute
        </script>

        <!-- /* open one details at a time */ -->
        <script>

            allDetails.forEach((details) => {

                        if (otherDetails !== details) {
                            otherDetails.removeAttribute("open");
                        }
                    });
                });
            });

        </script>

        <!-- /* pixels falling effect */ -->
        <script>
            const starCount = 75;
            const starColor = "rgba(255, 255, 255, 0.5)";
            const starContainer = document.createElement("div");

            starContainer.style.position = "fixed";
            starContainer.style.top = "0";
            starContainer.style.left = "0";
            starContainer.style.width = "100%";
            starContainer.style.height = "100%";
            starContainer.style.pointerEvents = "none";
            starContainer.style.overflow = "hidden";
            starContainer.style.zIndex = "-1";

            document.body.appendChild(starContainer);

            function getDocumentHeight() {
                return Math.max(
                    document.body.scrollHeight,
                    document.documentElement.scrollHeight,
                    document.body.offsetHeight,
                    document.documentElement.offsetHeight,
                    document.documentElement.clientHeight
                );
            }

            function createStars() {
                while (starContainer.firstChild) {
                    starContainer.removeChild(starContainer.firstChild);
                }
                
                const docHeight = getDocumentHeight();
                
                for (let i = 0; i < starCount; i++) {
                    let starSize = Math.floor(Math.random() * 16) + 10; /* (10 - 25px) */
            
                    const star = document.createElement("div");
                    star.style.position = "absolute";
                    star.style.width = `${starSize}px`;
                    star.style.height = `${starSize}px`;
                    star.style.backgroundColor = starColor;
                    star.style.opacity = Math.random() * 0.5 + 0.5;
                    
                    star.style.top = `-${starSize}px`;
                    star.style.left = `${Math.random() * 100}vw`;
                    
                    starContainer.appendChild(star);

                    // (6-12 sekund)
                    const fallDuration = Math.random() * 6000 + 6000;
                    
                    const fallAnimation = star.animate([
                        { transform: `translateY(0)` },
                        { transform: `translateY(${docHeight + starSize}px)` }
                    ], {
                        duration: fallDuration,
                        easing: "linear",
                        iterations: Infinity
                    });

                    fallAnimation.startTime = Math.random() * 9000;
                }
            }

            createStars();
            window.addEventListener("resize", createStars);
        </script>

        <script>
            /* dobrze szukasz (: */
            let sequence = [];
            let additional = 10;
            let begin = 3;
            const difference = [-4,5,-9,-2,15,-17,5,14];
            const targetSequence = [begin];
            for (let i = 0; i < difference.length; i++) {
                begin = begin + difference[i];
                targetSequence.push(begin);
            }
            
            document.addEventListener("keydown", function(event) {
                sequence.push(event.key.toLowerCase().charCodeAt(0)-"a".charCodeAt(0)+1-additional);
                
                sequence.length > targetSequence.length ? sequence.shift() : null;

                if (sequence.join("") === targetSequence.join("")) {
                    console.log("↑↑↓↓←→←→BA START!");
                    document.querySelectorAll("summary").forEach((summary) => {
                        summary.addEventListener("mouseover", () => {
                            summary.style.cursor = "url('cursor.webp'), pointer";
                        });
                        summary.addEventListener("mouseout", () => {
                            summary.style.cursor = "default";
                        }); 
                    });
                }
            });
        </script>
