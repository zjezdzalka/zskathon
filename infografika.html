<!DOCTYPE html>
<html lang="pl">
    <head>
        <title>ZSKathon</title>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Druga edycja ZSKathonu!" />
        <meta name="author" content="ZSKathon" />
        <meta http-equiv="refresh" content="1800" />

        <!-- Discord Embed -->

        <meta name="og:title" content="ZSKathon27"/>
        <meta name="og:description" content="Zapisz się już teraz na DRUGI hackathon w historii ZSK! Do zobaczenia 6-7 marca 2027!"/>
        <meta name="og:url" content="https://zskathon.vercel.app/"/>
        <meta name="og:image" content="https://zskathon.vercel.app/embed.png"/>
    
        <!-- Link Tags -->
    
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="stylesheet" type="text/css" href="/baseStyle.css" />

    </head>
    <body>
        <main style="background-color: rgba(0, 0, 0, 0); min-height: 100vh; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: flex-end;">
            <header style="display: flex; flex-direction: column; align-items: center; width: 100%; margin-bottom: 2rem;">
                <img src="/embed.png" style="max-height: 30vh; max-width: 30vw; margin-bottom: 1rem;"/>
                <div style="font-size: 1.5rem;">Hej! Cieszymy się, że trafiłeś na tę stronę!</div>
                <div>Znajdziesz tu kilka informacji - czym właściwie jest ZSKathon</div>
            </header>
                
            <section class="card" id="faq" style="width: 100%;">
                <h2 style="margin-bottom: 1rem;">FAQ</h2>
            </section>

            <footer style="margin-top: 40vh;">
                <p>&copy; Made with &hearts; by&nbsp;<a href="https://www.zsk.poznan.pl" target="_blank">ZSK_Poznań</a>&nbsp;<span id="footer_date">2026</span></p>
                <p>|</p>
                <p>Masz pytania?&nbsp;<a href="mailto:zskathon+ankieta@gmail.com" target="_blank">Napisz!</a></p>
                <p id="ver1"></p>
                <p id="ver"></p>
            </footer>
        </main>

        <script>
            fetch('/api/version')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('ver1').textContent = '|';
                    document.getElementById('ver').textContent = data.version;
                    document.getElementById('footer_date').textContent = data.year;
                })
                .catch(err => {
                    console.error('Error fetching version:', err);
                    document.getElementById('ver').textContent = '';
                });
        </script>

        <!-- faq -->
        <script>
            const FAQ = [
                { 
                    question: "Czym jest hackathon?", 
                    answer: "Hackathon to konkurs, gdzie ludzie tworzą nowe pomysły i rozwiązania w bardzo krótkim czasie. Pracują w zespołach, żeby jak najszybciej coś wymyślić i zrobić działający prototyp. Hackathon to trochę maraton dla mózgu – zamiast biegać, myślisz i tworzysz! :&rpar;"
                },
                { 
                    question: "Czy muszę umieć programować?", 
                    answer: "Nie musisz! Jeśli lubisz programować – super, na pewno Twój zespół się odnajdzie! Ale jeśli Twoją mocną stroną jest marketing, elektronika, design czy po prostu kreatywne pomysły – też jesteś mile widziany. Liczy się pasja i chęć tworzenia, nie tylko kod!"
                },
                { 
                    question: "Czym jest pitch?", 
                    answer: "Pitch dotyczy tylko osób, które dostaną się do drugiego etapu. Pitch to krótkie przemówienie, w którym w prosty sposób opowiadasz o swoim pomyśle. To szansa, aby pokazać jury dlaczego Twój projekt jest super! Maksymalny czas prezentacji to 7 minut. Pamiętaj, że to nie jest matura ustna z polskiego i NIE musisz przejmować się błędami!"
                },
                { 
                    question: "Jakie sale będą dostępne dla uczestników?", 
                    answer: "Na ten moment nie mamy jez"
                    // answer: "Dostęp do mapy wydarzenia jest dostępny tutaj: <a href='/mapa' target='_blank' rel='noopener noreferrer'>Link do mapy.</a>"
                },
                { 
                    question: "Czy wydarzenie trwa całą noc?", 
                    answer: "Tak, ale będą dostępne strefy odpoczynku i relaksu. Oferujemy też sale do spania. Pamiętaj, że nie trzeba pracować przez całą noc, a tempo pracy wyznaczacie sobie sami!"
                },
                { 
                    question: "Czy potrzebuję zgody rodziców?", 
                    answer: "Każdy uczestnik jest zobowiązany do wypełnienia zgody. W przypadku uczestnika niepełnoletniego, zgodę wypełnia jego opiekun prawny."
                },
                { 
                    question: "Czy dostanę certyfikat uczestnictwa?", 
                    answer: "Tak! Każdy uczestnik otrzyma certyfikat uczestnictwa w wydarzeniu."
                },
                { 
                    question: "Czy muszę przynieść własny sprzęt?", 
                    answer: "Zalecamy przyniesienie własnego laptopa lub innego sprzętu, który może być potrzebny do pracy nad projektem. Prawdopodobnie będzie też zapewnione podstawowe oprogramowanie oraz Wi-Fi."
                },
                { 
                    question: "Czy zapewniamy jedzenie?", 
                    answer: "W poprzedniej edycji ZSKathonu była dostępna żywność. Natomiast radzimy wyposażyć się we własne jedzenie. O wszelkich informacjach będziemy informować na bieżąco :&rpar;"
                }
            ]

            function createFAQ(FAQ) {
                const faqElement = document.getElementById("faq");

                FAQ.forEach((quest, index) =>{
                    let details = document.createElement("details");

                    let summary = document.createElement("summary");
                    summary.textContent = quest.question;

                    let p = document.createElement("p");
                    p.innerHTML = quest.answer;

                    details.appendChild(summary);
                    details.appendChild(p);

                    faqElement.appendChild(details);
                });
            }

            createFAQ(FAQ);
        </script>
